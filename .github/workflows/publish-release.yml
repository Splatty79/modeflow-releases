name: Publish ModeFlow APK

on:
  push:
    branches: [main]
    paths:
      - release-request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release channel
        uses: actions/checkout@v4

      - name: Validate release request
        id: request
        shell: bash
        run: |
          version_name="$(jq -r '.versionName' release-request.json)"
          version_code="$(jq -r '.versionCode' release-request.json)"
          archive_sha="$(jq -r '.archiveSha256' release-request.json)"
          apk_sha="$(jq -r '.sha256' release-request.json)"

          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version_code" =~ ^[0-9]+$ ]]
          [[ "$archive_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$apk_sha" =~ ^[0-9a-f]{64}$ ]]

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$apk_sha" >> "$GITHUB_OUTPUT"

      - name: Reassemble and verify signed APK
        env:
          ARCHIVE_SHA: ${{ steps.request.outputs.archive_sha }}
          APK_SHA: ${{ steps.request.outputs.apk_sha }}
          VERSION_NAME: ${{ steps.request.outputs.version_name }}
        shell: bash
        run: |
          transfer_dir=".transfer/v$VERSION_NAME"
          archive_path="$RUNNER_TEMP/ModeFlow-v$VERSION_NAME-artifact.zip"
          apk_path="$RUNNER_TEMP/ModeFlow-v$VERSION_NAME.apk"

          mapfile -d '' parts < <(find "$transfer_dir" -maxdepth 1 -type f -name 'part-*' -print0 | sort -z)
          [[ "${#parts[@]}" -gt 0 ]]
          cat "${parts[@]}" > "$archive_path"
          echo "$ARCHIVE_SHA  $archive_path" | sha256sum --check

          unzip -p "$archive_path" app-debug.apk > "$apk_path"
          echo "$APK_SHA  $apk_path" | sha256sum --check
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"
          echo "APK_NAME=ModeFlow-v$VERSION_NAME.apk" >> "$GITHUB_ENV"
          echo "TRANSFER_DIR=$transfer_dir" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.request.outputs.version_name }}
        shell: bash
        run: |
          tag="v$VERSION_NAME"
          jq -r '.notes' release-request.json > "$RUNNER_TEMP/release-notes.txt"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$APK_PATH" --clobber
          else
            gh release create "$tag" "$APK_PATH" --title "ModeFlow $VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi

      - name: Update app manifest and clear transfer files
        env:
          VERSION_NAME: ${{ steps.request.outputs.version_name }}
          VERSION_CODE: ${{ steps.request.outputs.version_code }}
        shell: bash
        run: |
          apk_url="https://github.com/Splatty79/modeflow-releases/releases/download/v$VERSION_NAME/$APK_NAME"
          jq --argjson versionCode "$VERSION_CODE" \
             --arg versionName "$VERSION_NAME" \
             --arg apkUrl "$apk_url" \
             '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, notes: .notes}' \
             release-request.json > latest.json
          git config user.name "ModeFlow Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -r "$TRANSFER_DIR"
          git add latest.json
          git commit -m "Publish ModeFlow v$VERSION_NAME"
          git push
